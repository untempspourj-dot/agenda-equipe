<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de l'Équipe</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --share: #0ea5e9;
            --share-hover: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        header {
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 {
            color: var(--primary);
            font-size: 1.8rem;
        }

        .share-box {
            display: flex;
            gap: 0.5rem;
        }

        .btn-share {
            background-color: var(--share);
            font-size: 0.85rem;
            padding: 0.5rem 0.8rem;
        }

        .btn-share:hover {
            background-color: var(--share-hover);
        }

        .event-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
            background: #f1f5f9;
            padding: 1.5rem;
            border-radius: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-light);
        }

        input, select {
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .btn {
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary);
            align-self: flex-end;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .event-list {
            margin-top: 1rem;
        }

        .event-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 0.75rem;
            background: var(--surface);
            transition: transform 0.2s;
        }

        .event-item:hover {
            transform: translateX(4px);
        }

        .event-details {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .event-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .event-meta {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .member-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            background: #e0e7ff;
            color: #3730a3;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .action-btns {
            display: flex;
            gap: 0.5rem;
        }

        .view-btn {
            background-color: var(--success);
        }

        .view-btn:hover {
            background-color: #059669;
        }

        .delete-btn {
            background-color: #ef4444;
        }

        .delete-btn:hover {
            background-color: #dc2626;
        }

        .no-events {
            text-align: center;
            color: var(--text-light);
            padding: 2rem;
            font-style: italic;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            position: relative;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            color: var(--primary);
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
            font-size: 1.4rem;
        }

        .modal-body p {
            margin-bottom: 1rem;
            font-size: 1.05rem;
            line-height: 1.5;
        }

        .modal-body b {
            color: var(--text-light);
        }

        .close-modal {
            background-color: #64748b;
            margin-top: 1rem;
            float: right;
        }

        .close-modal:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📅 Agenda de l'Équipe</h1>
        <div class="share-box">
            <button class="btn btn-share" onclick="copyLink(this)">🔗 Copier le lien</button>
            <button class="btn btn-share" onclick="shareApp()">📤 Envoyer aux amis</button>
        </div>
    </header>

    <form id="eventForm" class="event-form">
        <div class="form-group" style="grid-column: span 2;">
            <label for="title">Titre de la réunion / tâche</label>
            <input type="text" id="title" placeholder="Ex: Réunion d'équipe" required>
        </div>
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label for="time">Heure</label>
            <input type="time" id="time" required>
        </div>
        <div class="form-group">
            <label for="member">Membre concerné</label>
            <select id="member" required>
                <option value="Toute l'équipe">Toute l'équipe</option>
                <option value="Jiresse">Jiresse</option>
                <option value="John">John</option>
                <option value="Linda">Linda</option>
                <option value="Dimercia">Dimercia</option>
                <option value="Halvine">Halvine</option>
                <option value="Oscar">Oscar</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Ajouter</button>
    </form>

    <div class="event-list" id="eventList">
        <p class="no-events">Connexion à la base de données...</p>
    </div>
</div>

<div id="detailsModal" class="modal">
    <div class="modal-content">
        <h2 class="modal-header">📋 Détails de la tâche</h2>
        <div class="modal-body" id="modalBody"></div>
        <button class="btn close-modal" onclick="closeModal()">Fermer</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuration Firebase avec VOS clés valides
    const firebaseConfig = {
        apiKey: "AIzaSyB5z5mR3FpiZ8tP_zTWhxNmKRvfVVit76I",
        authDomain: "agenda-equipe-60993.firebaseapp.com",
        projectId: "agenda-equipe-60993",
        storageBucket: "agenda-equipe-60993.firebasestorage.app",
        messagingSenderId: "922599252323",
        appId: "1:922599252323:web:1d2da1c2ea3f16a92a3356",
        measurementId: "G-W5D5ZL7XY5"
    };

    // Initialisation
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const eventsCollection = collection(db, "events");

    const eventForm = document.getElementById('eventForm');
    const eventList = document.getElementById('eventList');
    const detailsModal = document.getElementById('detailsModal');
    const modalBody = document.getElementById('modalBody');

    let localEvents = [];

    // Écoute en temps réel
    onSnapshot(eventsCollection, (snapshot) => {
        localEvents = [];
        snapshot.forEach(doc => {
            localEvents.push({ id: doc.id, ...doc.data() });
        });

        localEvents.sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));
        displayEvents(localEvents);
    }, (error) => {
        console.error("Erreur Firebase Firestore :", error);
        eventList.innerHTML = `<p class="no-events" style="color:red;">Erreur de connexion. Vérifiez que Firestore est bien en 'Mode Test'.</p>`;
    });

    function displayEvents(events) {
        eventList.innerHTML = '';

        if (events.length === 0) {
            eventList.innerHTML = '<p class="no-events">Aucun événement de prévu. Bon temps libre !</p>';
            return;
        }

        events.forEach((event) => {
            const eventDate = new Date(event.date).toLocaleDateString('fr-FR', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });

            const eventItem = document.createElement('div');
            eventItem.className = 'event-item';
            eventItem.innerHTML = `
                <div class="event-details">
                    <div class="event-title">${event.title}</div>
                    <div class="event-meta">
                        🕒 <b>${eventDate}</b> à <b>${event.time}</b> 
                        <span class="member-badge">👤 ${event.member}</span>
                    </div>
                </div>
                <div class="action-btns">
                    <button class="btn view-btn" data-id="${event.id}">Voir détails</button>
                    <button class="btn delete-btn" data-id="${event.id}">Supprimer</button>
                </div>
            `;
            eventList.appendChild(eventItem);
        });

        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', () => openModal(btn.getAttribute('data-id')));
        });
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', () => deleteEvent(btn.getAttribute('data-id')));
        });
    }

    eventForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const newEvent = {
            title: document.getElementById('title').value,
            date: document.getElementById('date').value,
            time: document.getElementById('time').value,
            member: document.getElementById('member').value
        };

        try {
            await addDoc(eventsCollection, newEvent);
            eventForm.reset();
        } catch (error) {
            alert("Erreur lors de l'ajout : " + error.message);
        }
    });

    async function deleteEvent(id) {
        if(confirm("Voulez-vous vraiment supprimer cette tâche ?")) {
            try {
                await deleteDoc(doc(db, "events", id));
            } catch (error) {
                alert("Erreur lors de la suppression : " + error.message);
            }
        }
    }

    function openModal(id) {
        const event = localEvents.find(e => e.id === id);
        if (!event) return;

        const eventDate = new Date(event.date).toLocaleDateString('fr-FR', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
        });

        modalBody.innerHTML = `
            <p><b>Titre / Mission :</b><br> ${event.title}</p>
            <p><b>Assigné à :</b><br> 👤 ${event.member}</p>
            <p><b>Date prévue :</b><br> 📅 ${eventDate}</p>
            <p><b>Heure :</b><br> 🕒 ${event.time}</p>
            <p style="font-size:0.75rem; color:#64748b; margin-top:2rem; border-top: 1px dashed #e2e8f0; padding-top:0.5rem; word-break: break-all;">
                ID Cloud : ${event.id}
            </p>
        `;
        detailsModal.style.display = 'flex';
    }

    window.closeModal = function() {
        detailsModal.style.display = 'none';
    }
    
    window.onclick = function(event) {
        if (event.target == detailsModal) {
            closeModal();
        }
    }
</script>

<script>
    function copyLink(buttonElement) {
        const currentUrl = window.location.href;
        navigator.clipboard.writeText(currentUrl).then(() => {
            const originalText = buttonElement.innerHTML;
            buttonElement.innerHTML = "✅ Lien copié !";
            buttonElement.style.backgroundColor = "var(--success)";
            setTimeout(() => {
                buttonElement.innerHTML = originalText;
                buttonElement.style.backgroundColor = "var(--share)";
            }, 2000);
        }).catch(() => alert("Erreur lors de la copie."));
    }

    function shareApp() {
        if (navigator.share) {
            navigator.share({
                title: "Agenda de notre Équipe",
                text: "Regarde notre planning d'équipe ici !",
                url: window.location.href
            }).catch(console.error);
        } else {
            alert("Copiez simplement le lien avec le bouton à gauche pour l'envoyer !");
        }
    }
</script>

</body>
</html>
